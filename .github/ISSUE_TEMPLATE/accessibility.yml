name: Accessibility barrier
description: Something on the site you cannot see, read, hear, reach or operate. It is treated as a bug.
labels: [accessibility]
body:
  - type: input
    id: url
    attributes:
      label: Page
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, device and OS
    validations:
      required: true
  - type: input
    id: tech
    attributes:
      label: Assistive technology and its version
      description: A screen reader, zoom or text size, high contrast, keyboard only, voice control and so on. Say None if there is none.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what the site did or did not do.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
