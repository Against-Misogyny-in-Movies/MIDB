name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: pull requests from forks run with no write access. Actions are pinned to a
# commit, not a movable tag; Dependabot (.github/dependabot.yml) proposes the updates.
permissions:
  contents: read

jobs:
  static:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # $env/static/* needs every variable defined; the placeholders are enough.
      - name: Create .env from template
        run: cp .env.example .env

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unit specs mock $env/* and $lib/server/db, so no secrets, .env or database are needed.
      - name: Run unit tests
        run: pnpm test:unit --run

  # Fails when a schema file changed without a committed migration. Needs no database;
  # a drizzle-kit prompt (rename vs create) also fails it, because CI has no TTY.
  migrations:
    name: Migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate migrations from the schema
        run: pnpm exec drizzle-kit generate --name drift_check

      - name: Fail on uncommitted migration changes
        run: |
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "Schema changed without a committed migration (run pnpm db:generate):"
            git status --porcelain db/migrations
            git diff db/migrations
            exit 1
          fi

  # Data-layer tests against a real Postgres. global-setup migrates the empty database
  # from zero, so this job also proves the migration chain applies cleanly.
  db:
    name: DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DB_CONNECTION: postgres://postgres:postgres@localhost:5432/midb_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB tests
        run: pnpm test:db

  # Disabled until the repo variable E2E_ENABLED is set to 'true' and the secrets
  # below are configured (Settings → Secrets and variables → Actions).
  e2e:
    name: E2E tests
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_CONNECTION: postgres://postgres:postgres@localhost:5432/midb
      PUBLIC_HANKO_API_URL: ${{ vars.PUBLIC_HANKO_API_URL }}
      PUBLIC_TMDB_API_URL: https://api.themoviedb.org
      PUBLIC_TMDB_IMAGE_URL: https://image.tmdb.org/t/p
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      DDD_API_KEY: ${{ secrets.DDD_API_KEY }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate database
        run: pnpm db:migrate

      # playwright.config.ts builds and starts `vite preview` itself (webServer).
      - name: Run e2e tests
        run: pnpm test:integration

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The pull request title becomes the squash commit's subject (.claude/rules/commit-standards.md, Squash),
  # so the title and every commit subject are checked.
  commits:
    name: Commit subjects
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/git/commit-message.ts "$TITLE"

      - name: Commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/git/commit-message.ts --range "$BASE..$HEAD"
