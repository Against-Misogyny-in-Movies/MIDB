name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Unit specs mock $env/*, so no secrets or .env are needed.
      - name: Run unit tests
        run: bun run test:unit --run

  # Disabled until the repo variable E2E_ENABLED is set to 'true' and the secrets
  # below are configured (Settings → Secrets and variables → Actions).
  e2e:
    name: E2E tests
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_CONNECTION: postgres://postgres:postgres@localhost:5432/midb
      PUBLIC_HANKO_API_URL: ${{ vars.PUBLIC_HANKO_API_URL }}
      PUBLIC_TMDB_API_URL: https://api.themoviedb.org
      PUBLIC_TMDB_IMAGE_URL: https://image.tmdb.org/t/p
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      DDD_API_KEY: ${{ secrets.DDD_API_KEY }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Migrate database
        run: bun run db:migrate

      # playwright.config.ts builds and starts `vite preview` itself (webServer).
      - name: Run e2e tests
        run: bun run test:integration

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
