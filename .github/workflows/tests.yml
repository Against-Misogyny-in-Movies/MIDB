name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # $env/static/* needs every variable defined; the placeholders are enough.
      - name: Create .env from template
        run: cp .env.example .env

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Unit specs mock $env/* and $lib/server/db, so no secrets, .env or database are needed.
      - name: Run unit tests
        run: bun run test:unit --run

  # Fails when a schema file changed without a committed migration. Needs no database;
  # a drizzle-kit prompt (rename vs create) also fails it, because CI has no TTY.
  migrations:
    name: Migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate migrations from the schema
        run: bunx drizzle-kit generate --name drift_check

      - name: Fail on uncommitted migration changes
        run: |
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "Schema changed without a committed migration (run bun run db:generate):"
            git status --porcelain db/migrations
            git diff db/migrations
            exit 1
          fi

  # Data-layer tests against a real Postgres. global-setup migrates the empty database
  # from zero, so this job also proves the migration chain applies cleanly.
  db:
    name: DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DB_CONNECTION: postgres://postgres:postgres@localhost:5432/midb_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run DB tests
        run: bun run test:db

  # Disabled until the repo variable E2E_ENABLED is set to 'true' and the secrets
  # below are configured (Settings → Secrets and variables → Actions).
  e2e:
    name: E2E tests
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_CONNECTION: postgres://postgres:postgres@localhost:5432/midb
      PUBLIC_HANKO_API_URL: ${{ vars.PUBLIC_HANKO_API_URL }}
      PUBLIC_TMDB_API_URL: https://api.themoviedb.org
      PUBLIC_TMDB_IMAGE_URL: https://image.tmdb.org/t/p
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      DDD_API_KEY: ${{ secrets.DDD_API_KEY }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Migrate database
        run: bun run db:migrate

      # playwright.config.ts builds and starts `vite preview` itself (webServer).
      - name: Run e2e tests
        run: bun run test:integration

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
